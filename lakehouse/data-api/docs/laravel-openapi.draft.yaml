      - Meneruskan Data API `/v1/katalog` tanpa mengubah bentuk `data` (string JSON mentah, SPEC §4.4).
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                - meta
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                            description:
                              type: string
                            tags:
                              type: array
                              items:
                                type: string
                            tier:
                              type: string
                            source:
                              type: string
                            size_label:
                              type: string
                            href:
                              type: string
                            external:
                              type: boolean
                            medallion:
                              oneOf:
                              - type: 'null'
                              - type: object
                                properties:
                                  level:
                                    type: string
                                  mart:
                                    type: string
                                required:
                                - level
                          required:
                          - id
                          - title
                          - description
                          - tags
                          - tier
                          - source
                          - size_label
                          - href
                          - external
                          - medallion
                      stats:
                        type: object
                        properties:
                          total:
                            type: integer
                          tags:
                            type: integer
                          views:
                            type: integer
                          last_updated:
                            type: string
                        required:
                        - total
                        - tags
                        - views
                        - last_updated
                      layer_counts:
                        type: object
                        additionalProperties:
                          type: integer
                    required:
                    - items
                    - stats
                    - layer_counts
                  meta: &id001
                    allOf:
                    - $ref: '#/components/schemas/Meta'
                    - type: object
                      required:
                      - sumber
                      - stale
                      properties:
                        sumber:
                          type: string
                          enum:
                          - data_api
                          - cache
                          - snapshot
                        stale:
                          type: boolean
              example:
                success: true
                message: OK
                data:
                  items:
                  - id: sdi-data-jumlah-wisatawan-mancanegara-berdasarkan-kebangsaan
                    title: Data Jumlah Wisatawan Mancanegara Berdasarkan Kebangsaan
                    description: Data ini berisikan data kunjungan wisatawan mancanegara ditinjau dari kebangsaannya
                      dan merupakan kelanjutan dari data kunjungan wisatawan mancanegara ditinjau dari kebangsaannya
                      tahun 2023.
                    tags:
                    - wisatawan mancanegara
                    - kebangsaan
                    tier: primer
                    source: SDI · Satu Data Jakarta
                    size_label: 1.598 dilihat
                    href: /sdi/data-jumlah-wisatawan-mancanegara-berdasarkan-kebangsaan
                    external: false
                    medallion:
                      level: silver
                  - id: sdi-nilai-kepuasan-pengunjung-objek-wisata
                    title: Nilai Kepuasan Pengunjung Objek Wisata
                    description: Data ini berisikan nilai rata-rata hasil survey kepuasan pengunjung yang dilakukan
                      oleh Dinas Pariwisata dan Ekonomi Kreatif setiap tahun terhadap objek wisata. Lokasi objek
                      wisata yang disurvey sama setiap tahunnya. Pengukuran tingkat kepuasan pengunjung menggunakan
                      skala 1-100.
                    tags:
                    - nilai kepuasan
                    - pengunjung
                    tier: primer
                    source: SDI · Satu Data Jakarta
                    size_label: 936 dilihat
                    href: /sdi/nilai-kepuasan-pengunjung-objek-wisata
                    external: false
                    medallion:
                      level: silver
                  stats:
                    total: 184
                    tags: 264
                    views: 68553
                    last_updated: '2026-10-21T03:19:38.000000Z'
                  layer_counts:
                    bronze: 2
                    silver: 216
                    gold: 5
