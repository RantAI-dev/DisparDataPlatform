components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: Token Sanctum akun layanan (`php artisan portal:token {nama} {ability}`).
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Dipantulkan di header respons dan `meta.request_id`; dibuat server bila kosong.
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9-]*$
      example: data-jumlah-wisatawan-mancanegara-berdasarkan-kebangsaan
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 500
      description: Cari teks di semua kolom (tanpa beda huruf besar/kecil).
    F:
      name: f
      in: query
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          pattern: ^[^:]+:(in|range):.*$
          maxLength: 1000
      description: 'Filter berulang, tata bahasa sama dengan platform-v2 `lib/ch/query-filter.ts`: `kolom:in:nilai`
        (ulangi untuk nilai lain), `kolom:range:min..max` (salah satu ujung boleh kosong). Maks 20 kolom, 100 nilai
        per kolom.'
      example:
      - kebangsaan:in:JEPANG
    Sort:
      name: sort
      in: query
      schema:
        type: string
        pattern: ^[^:]+:(asc|desc)$
      description: Urut satu kolom Silver. Tanpa `sort` urutan tetap deterministik (cityHash64 baris).
    Framework:
      name: framework
      in: query
      required: true
      schema:
        type: string
        enum:
        - GCI
        - GPCI
  schemas:
    Meta:
      type: object
      required:
      - generated_at
      - source
      - request_id
      properties:
        generated_at:
          type: string
          format: date-time
        source:
          type: array
          items:
            type: string
          description: Tabel ClickHouse yang dibaca.
        request_id:
          type: string
          description: Sama dengan header X-Request-Id (dipantulkan).
    MetaTotal:
      allOf:
      - $ref: '#/components/schemas/Meta'
      - type: object
        required:
        - total
        properties:
          total:
            type: integer
            minimum: 0
    MetaHalaman:
      allOf:
      - $ref: '#/components/schemas/Meta'
      - type: object
        required:
        - page
        - size
        - total
        - has_more
        properties:
          page:
            type: integer
            minimum: 1
          size:
            type: integer
            minimum: 1
          total:
            type: integer
            minimum: 0
          has_more:
            type: boolean
    Sukses:
      type: object
      required:
      - success
      - message
      - data
      - meta
      properties:
        success:
          type: boolean
        message:
          type: string
        data: {}
        meta:
          type: object
    Gagal:
      type: object
      required:
      - success
      - message
      - errors
      - meta
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: object
          required:
          - code
          properties:
            code:
              type: string
        meta:
          type: object
          required:
          - request_id
          properties:
            request_id:
              type: string
  responses:
    Gagal:
      description: Gagal (status HTTP diteruskan dari Data API; 503 kecuali snapshot tersedia)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Gagal'
          example:
            success: false
            message: Data tidak ditemukan
            errors:
              code: NOT_FOUND
            meta:
              request_id: contoh-01
