# DRAF API publik Laravel (plan 01 portal). Versi final dihasilkan scramble di repo portal.
openapi: 3.1.0
info:
  title: API publik portal Disparekraf (Laravel) — DRAF
  version: 0.1.0-draft
  description: 'Draf dari plan 01. Plan 10 menyalinnya ke repo portal `docs/api/`; versi final dihasilkan scramble.
    Envelope SPEC §4.4; tanpa PATCH; autentikasi token Sanctum (frontend: ability `read`, admin: `admin`).'
