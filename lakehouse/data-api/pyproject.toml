[project]
name = "dispar-data-api"
version = "0.1.0"
description = "Data API read-only lakehouse Dispar untuk portal Disparekraf (kontrak: openapi.yaml)"
requires-python = ">=3.12"
# Dependensi runtime (FastAPI, klien ClickHouse) ditambahkan plan 02.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "openapi-spec-validator>=0.7", "pyyaml>=6"]

[tool.uv]
# Kerangka plan 01 belum punya paket Python; plan 02 menambah `data_api/`.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
