nama = "dim_wilayah"
deskripsi = "Dimensi wilayah administrasi berjenjang sesuai kodifikasi Kemendagri"
grain = ["kode"]
kelas_refresh = "snapshot"
pemilik = "perintis"

[[kolom]]
nama = "kode"
tipe = "String"
deskripsi = "Kode wilayah berformat Kemendagri bertitik (misal: 31.71, 31.71.01)"
wajib = true

[[kolom]]
nama = "nama"
tipe = "String"
deskripsi = "Nama resmi wilayah administrasi"
wajib = true

[[kolom]]
nama = "tingkat"
tipe = "String"
deskripsi = "Tingkat administrasi wilayah"
