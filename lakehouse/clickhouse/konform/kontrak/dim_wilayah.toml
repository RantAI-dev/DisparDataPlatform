[[kolom]]
nama = "kode_kecamatan"
tipe = "Nullable(String)"
deskripsi = "Kode kecamatan wilayah (8 karakter awal)"

[[kolom]]
nama = "nama_kabkota"
tipe = "Nullable(String)"
deskripsi = "Nama kabupaten/kota induk"

[[kolom]]
nama = "nama_kecamatan"
tipe = "Nullable(String)"
deskripsi = "Nama kecamatan induk"

[[kolom]]
