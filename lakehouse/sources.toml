# Catatan: files.read_json memilih list pertama — untuk {slug,title,description,
# columns,rows} itu `columns`, bukan `rows`. Jadi bronze_file.wellness_jakarta
# dan bronze_file.water_attractions_jakarta berisi definisi kolom, bukan data.
# Silver.wellness_jakarta dan silver.water_attractions_jakarta membaca
# bronze_sec.* (lihat tabel_lain di bawah). Tabel bronze_file ini tidak dipakai
# niari aplikasi; dicatat supaya jejak hilang sumber info tak hilang.
# Bentrokan basename: run_bronze.ingest_files menurunkan nama tabel dari basename
# berkas saja, jadi `data/water-attractions-jakarta.json` dan
# `data/sekunder/water-attractions-jakarta.json` keduanya menunjuk
# `bronze_file.water_attractions_jakarta` — registri di sini hanya atribusikan ke
# yang pertama. Plan 02 (ingest berbasis registri) JANGAN scanning folder; harus
# mengikuti entri [[sumber]] satu per satu supaya tabel_lain tercatat benar.

[[sumber]]
