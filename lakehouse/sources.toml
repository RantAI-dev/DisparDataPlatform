# Registri sumber data mentah lakehouse Dispar.
#
# Tujuan: satu-satunya tempat yang menjawab "raw apa saja yang kita punya dan
# mana yang bisa di-refresh". Dibaca oleh dispar_ingest.sources dengan tomllib
# (stdlib, tanpa dependensi tambahan).
#
# Dua bagian:
#   [[sumber]]   entri yang dipakai sama detail: dapur ingest Bronze
#   [[abaikan]]  entri yang sengaja TIDAK dipakai; alasan menjelaskan kenapa
#
# Aturan singkat (lihat tests/test_sources.py untuk versi lengkap):
#   - id             kebab-case, unik di semua [[sumber]]
#   - jenis          "sdi" | "berkas" | "sekunder"
#   - kelas_refresh  "terjadwal" | "saat_berubah" | "snapshot"
#   - namespace      "bronze_sdi" | "bronze_file" | "bronze_sec"
#   - asal           frasa yang bisa ditelusuri, atau "belum diketahui"
#   - path           relatif ke root repo; WAJIB untuk berkas & sekunder
#   - tabel          identifier tabel Bronze; WAJIB untuk berkas & sekunder
#   - tanggal_ambil  YYYY-MM-DD; WAJIB untuk snapshot; dihitung dari
#                    `git log --diff-filter=A --format=%as -- <path> | tail -1`
#   - pembangun      path skrip yang menghasilkan berkas; "" kalau tidak ada
#   - tabel_lain     daftar "namespace.tabel" tambahan dari berkas yang sama
#
# Berkas yang dipakai oleh Bronze ikut [[sumber]]. Yang lain (termasuk yang
# discover() lewat tapi belum punya tabel, dan yang difilter oleh POLA_ABAIKAN)
# masuk [[abaikan]].

[[sumber]]
id = "sdi"
jenis = "sdi"
kelas_refresh = "terjadwal"
namespace = "bronze_sdi"
asal = "Satu Data Jakarta, unit Disparekraf"

