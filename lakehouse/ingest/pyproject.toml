[project]
name = "dispar-ingest"
version = "0.1.0"
description = "Ingestion Bronze untuk lakehouse Platform Data Dispar"
requires-python = ">=3.11"
dependencies = [
    "dlt[filesystem,pyiceberg]>=1.10",
    "pyiceberg[s3fs,pyarrow]>=0.8",
    "requests>=2.32",
    "pyarrow>=17",
    "openpyxl>=3.1",
    "clickhouse-connect>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "dagster>=1.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dispar_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../orchestrate"]
