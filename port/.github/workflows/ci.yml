# CI portal selama repo di GitHub (SPEC §9). Isi job identik dengan .gitlab-ci.yml: perintahnya
# ada di scripts/ci/*.sh, berkas ini hanya menyiapkan lingkungan (image PHP + Oracle service).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pint, Pest, dump Oracle)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      oracle:
        image: gvenzl/oracle-xe:18-slim
        # Sandi khusus CI (service sekali pakai). Tes memaksa skema portal_test (phpunit.xml).
        env:
          ORACLE_PASSWORD: portal_ci
          APP_USER: portal_test
          APP_USER_PASSWORD: portal_test
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s
          --health-retries 60 --health-start-period 60s
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image PHP 8.2 + oci8 (backend/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: dispar-portal-php:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: pint + Pest
        run: >-
          docker run --rm --network host -u "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/portal" -w /portal
          -e DB_CONNECTION=oracle -e DB_HOST=127.0.0.1 -e DB_PORT=1521
          -e DB_SERVICE_NAME=XEPDB1 -e DB_SERVER_VERSION=12c
          dispar-portal-php:ci bash scripts/ci/backend.sh
      - name: Dump bisa diterapkan ke skema kosong + grep fitur terlarang
        env:
          ORACLE_PASSWORD: portal_ci
          ORACLE_SQLPLUS: docker exec -i ${{ job.services.oracle.id }} sqlplus -s -L
        run: scripts/oracle-dump.sh --cek && scripts/cek-oracle-terlarang.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pest-junit
          path: backend/storage/logs/pest-junit.xml
          if-no-files-found: ignore

  migrasi-xe21:
    name: migration di Oracle XE 21
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        env:
          ORACLE_PASSWORD: portal_ci
          APP_USER: portal_ci
          APP_USER_PASSWORD: portal_ci
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s
          --health-retries 60 --health-start-period 60s
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: dispar-portal-php:ci
          cache-from: type=gha
      - name: migrate:fresh --seed, rollback, migrate
        run: >-
          docker run --rm --network host -u "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/portal" -w /portal
          -e DB_CONNECTION=oracle -e DB_HOST=127.0.0.1 -e DB_PORT=1521
          -e DB_SERVICE_NAME=XEPDB1 -e DB_SERVER_VERSION=12c
          -e DB_USERNAME=portal_ci -e DB_PASSWORD=portal_ci
          dispar-portal-php:ci bash scripts/ci/migrasi.sh

  frontend:
    name: frontend (eslint, typecheck, Vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/ci/frontend.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-junit
          path: frontend/test-results/vitest-junit.xml
          if-no-files-found: ignore

  e2e:
    name: e2e (Playwright + Laravel + fixture)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      oracle:
        image: gvenzl/oracle-xe:18-slim
        env:
          ORACLE_PASSWORD: portal_ci
          APP_USER: portal_test
          APP_USER_PASSWORD: portal_test
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s
          --health-retries 60 --health-start-period 60s
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: dispar-portal-php:ci
          cache-from: type=gha
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Laravel berjalan di image PHP (oci8); fixture-server dan Playwright di runner.
      - run: >-
          LARAVEL_JALAN="docker run --rm --network host -u $(id -u):$(id -g) -e HOME=/tmp
          -v $PWD:/portal -w /portal -e TOKEN_BERKAS=/portal/frontend/.e2e-token
          -e DB_CONNECTION=oracle -e DB_HOST=127.0.0.1 -e DB_PORT=1521 -e DB_SERVICE_NAME=XEPDB1
          -e DB_SERVER_VERSION=12c -e DATA_API_URL=http://127.0.0.1:18090
          dispar-portal-php:ci bash scripts/ci/laravel-e2e.sh"
          bash scripts/ci/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
