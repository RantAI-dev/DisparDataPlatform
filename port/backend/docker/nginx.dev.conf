# nginx dev untuk Laravel (php-fpm di service `backend`). Konfigurasi produksi ada di deploy/ (plan 19).
server {
    listen 80;
    server_name _;
    root /var/www/backend/public;
    index index.php;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        # Ekspor dataset dialirkan (SPEC §4.6 kelas aliran).
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }

    location ~ /\. {
        deny all;
    }
}
