                        description: Σ baris dataset sekunder (Data API menghitung dari Bronze; contoh = nilai katalog
                          app 21 Okt 2026).
                      indikator:
                        type: object
                        required:
                        - gci
                        - gpci
                        - total
                        properties:
                          gci:
                            type: integer
                          gpci:
                            type: integer
                          total:
                            type: integer
                      indeks_global:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                data:
                  dataset_primer: 184
                  dataset_sekunder: 44
                  baris_sekunder: 19428
                  indikator:
                    gci: 8
                    gpci: 20
                    total: 28
                  indeks_global: 2
                meta:
                  generated_at: '2026-10-21T22:00:00+07:00'
                  source: *id041
                  request_id: contoh-01
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '503':
          $ref: '#/components/responses/E503'
  /v1/health:
    get:
      operationId: health
      tags:
      - sistem
      summary: Kesehatan Data API dan koneksi ClickHouse (tanpa token)
      security: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      x-catatan:
      - Tidak membaca `system.*` (profil app_readonly menolaknya); cek ClickHouse = `SELECT 1`.
      responses:
        '200':
          description: Sehat
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - clickhouse
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  clickhouse:
                    type: string
                    enum:
                    - ok
                  versi:
                    type: string
              example:
                status: ok
                clickhouse: ok
                versi: 0.1.0
        '503':
          $ref: '#/components/responses/E503'
  /v1/admin/cache/flush:
    post:
      operationId: cacheFlush
      tags:
      - sistem
      summary: Kosongkan cache in-process (dipanggil Dagster sesudah refresh_lakehouse)
      security:
      - bearer: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      x-catatan:
      - Hanya token bernama `dagster`. Pemasangan pemanggil di Dagster dikerjakan plan 06.
      responses:
        '200':
          description: Cache dikosongkan
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    required:
                    - dikosongkan
                    properties:
                      dikosongkan:
                        type: integer
                        minimum: 0
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                data:
                  dikosongkan: 0
                meta:
                  generated_at: '2026-10-21T22:00:00+07:00'
                  source: []
                  request_id: contoh-01
        '401':
          $ref: '#/components/responses/E401'
        '503':
          $ref: '#/components/responses/E503'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Token layanan; disimpan sebagai hash SHA-256 di env DATA_API_TOKENS (nama:hash).
  schemas:
    Meta:
      type: object
      required:
      - generated_at
      - source
      - request_id
      properties:
        generated_at:
          type: string
          format: date-time
        source:
          type: array
          items:
            type: string
          description: Tabel ClickHouse yang dibaca.
        request_id:
          type: string
          description: Sama dengan header X-Request-Id (dipantulkan).
        peringatan:
          type: array
          items:
            type: string
          description: Hanya ada bila sebagian sumber gagal dibaca dan data dikirim kosong (dashboard, Q21).
    MetaTotal:
      allOf:
      - $ref: '#/components/schemas/Meta'
      - type: object
        required:
        - total
        properties:
          total:
            type: integer
            minimum: 0
    MetaHalaman:
      allOf:
      - $ref: '#/components/schemas/Meta'
      - type: object
        required:
        - page
        - size
        - total
        - has_more
        properties:
          page:
            type: integer
            minimum: 1
          size:
            type: integer
            minimum: 1
          total:
            type: integer
            minimum: 0
          has_more:
            type: boolean
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - detail
          properties:
            code:
              type: string
              enum:
              - NOT_FOUND
              - INVALID_PARAM
              - INVALID_FILTER
              - TOO_LARGE
              - UNAUTHORIZED
              - UPSTREAM_UNAVAILABLE
            message:
              type: string
            detail:
              type:
              - string
              - 'null'
  responses:
    E400:
      description: Parameter tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_PARAM
              message: Parameter tidak valid
              detail: parameter `size` di luar 1..200
    E401:
      description: Token tidak ada atau tidak dikenal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Token tidak ada atau tidak dikenal
              detail: null
    E404:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Data tidak ditemukan
              detail: dataset `contoh-slug` belum ada di lakehouse
    E413:
      description: Hasil melebihi 100.000 baris
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: TOO_LARGE
              message: Hasil melebihi 100.000 baris
              detail: gunakan filter atau unduh per bagian
    E503:
      description: Lakehouse tidak dapat dibaca
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UPSTREAM_UNAVAILABLE
              message: Lakehouse tidak dapat dibaca
              detail: null
    E400Filter:
      description: Filter tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_FILTER
              message: Filter tidak valid
              detail: 'Kolom tidak dikenal: id'
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Dipantulkan di header respons dan `meta.request_id`; dibuat server bila kosong.
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9-]*$
      example: data-jumlah-wisatawan-mancanegara-berdasarkan-kebangsaan
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 500
      description: Cari teks di semua kolom (tanpa beda huruf besar/kecil).
    F:
      name: f
      in: query
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          pattern: ^[^:]+:(in|range):.*$
          maxLength: 1000
      description: 'Filter berulang, tata bahasa sama dengan platform-v2 `lib/ch/query-filter.ts`: `kolom:in:nilai`
        (ulangi untuk nilai lain), `kolom:range:min..max` (salah satu ujung boleh kosong). Maks 20 kolom, 100 nilai
        per kolom.'
      example:
      - kebangsaan:in:JEPANG
    Sort:
      name: sort
      in: query
      schema:
        type: string
        pattern: ^[^:]+:(asc|desc)$
      description: Urut satu kolom Silver. Tanpa `sort` urutan tetap deterministik (cityHash64 baris).
    Framework:
      name: framework
      in: query
      required: true
      schema:
        type: string
        enum:
        - GCI
        - GPCI
