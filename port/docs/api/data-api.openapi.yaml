# SALINAN dari repo DisparDataPlatform `lakehouse/data-api/openapi.yaml` @ 9580275c151f9fadf051ab6687b7f6ae6ab8a80b.
# Jangan diedit di sini: ubah sumbernya, lalu salin ulang (scripts/salin-openapi.sh).
# Kontrak Data API — ditulis plan 01 portal; dirawat tangan sesudahnya. Jangan dibangkitkan dari kode FastAPI.
openapi: 3.1.0
info:
  title: Data API lakehouse Dispar
  version: 1.0.0
  description: 'Kontrak Data API read-only untuk portal Disparekraf (SPEC portal §3, KONTRAK §2). Sumber kebenaran
    kontrak; portal hanya memegang salinannya untuk uji kontrak.


    Aturan umum: hanya GET kecuali `POST /v1/admin/cache/flush`; respons sukses `{data, meta}`; error `{error:{code,message,detail}}`;
    angka sebagai angka JSON; kolom audit tidak pernah keluar; dokumentasi otomatis FastAPI mati di produksi.


    `x-kelas`: T = tetap (snapshot), P = berparameter (cache TTL), S = aliran. `x-sumber`: tabel ClickHouse yang
    dibaca. `x-catatan`: keputusan dan penyimpangan dari usulan inventaris.'
servers:
- url: https://data-api.rantai.dev
  description: Produksi (hostname K-2; aktif setelah plan 06)
- url: http://localhost:8000
  description: Lokal
security:
- bearer: []
tags:
- name: dataset
- name: dashboard
- name: indikator
- name: atlas
- name: gmti
- name: spasial
- name: hotel-scraped
- name: beranda
- name: sistem
paths:
  /v1/katalog:
    get:
      operationId: katalog
      tags:
      - dataset
      summary: Katalog dataset primer (lake) + sekunder + medallion
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - name: tier
        in: query
        required: false
        schema:
          type: string
          enum:
          - semua
          - primer
          - sekunder
          default: semua
      - name: sumber
        in: query
        required: false
        description: Filter Sumber di Katalog Data (asal data mentah).
        schema:
          type: string
          enum:
          - semua
          - sdi
          - internal
          - instansi
          - crawling
          default: semua
      - name: tag
        in: query
        required: false
        description: Filter Tag; dicocokkan utuh tanpa beda huruf besar-kecil.
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 500
      security:
      - bearer: []
      x-kelas: T
      x-sumber: &id001
      - lake.bronze_meta.dataset_catalog
      - lake.bronze_meta_sec.dataset_catalog
      - lake.bronze_meta*.dataset_sync
      x-catatan:
      - Bentuk dan contoh = golden plan 01 (`tests/golden/`), keluaran logika Next.js yang tayang.
      - '`stats` = sdiStats atas baris primer; `layer_counts` dihitung atas seluruh katalog yang tampil (tier=primer
        → hanya primer), sama dengan CatalogView.'
      - '`size_label` = teks ukuran yang ditampilkan (`1.598 dilihat` / `2.577 baris`). KONTRAK catatan 1: untuk
        entri tautan atlas, Data API menghitung baris dari Bronze, bukan angka tulisan tangan; selisih dicatat plan
        02.'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                            description:
                              type: string
                            tags:
                              type: array
                              items:
                                type: string
                            tier:
                              type: string
                            sumber:
                              type: string
                              enum: [sdi, internal, instansi, crawling]
                            source:
                              type: string
                            size_label:
                              type: string
                            href:
                              type: string
                            external:
                              type: boolean
                            medallion:
                              oneOf:
                              - type: 'null'
                              - type: object
                                properties:
                                  level:
                                    type: string
                                  mart:
                                    type: string
                                required:
                                - level
                          required:
                          - id
                          - title
                          - description
                          - tags
                          - tier
                          - sumber
                          - source
                          - size_label
                          - href
                          - external
                          - medallion
                      stats:
                        type: object
                        properties:
                          total:
                            type: integer
                          tags:
                            type: integer
                          views:
                            type: integer
                          last_updated:
                            type: string
                        required:
                        - total
                        - tags
                        - views
                        - last_updated
                      layer_counts:
                        type: object
                        additionalProperties:
                          type: integer
                    required:
                    - items
                    - stats
                    - layer_counts
                  meta:
                    $ref: '#/components/schemas/MetaTotal'
              example:
                data:
                  items:
                  - id: sdi-data-jumlah-wisatawan-mancanegara-berdasarkan-kebangsaan
                    title: Data Jumlah Wisatawan Mancanegara Berdasarkan Kebangsaan
                    description: Data ini berisikan data kunjungan wisatawan mancanegara ditinjau dari kebangsaannya
                      dan merupakan kelanjutan dari data kunjungan wisatawan mancanegara ditinjau dari kebangsaannya
                      tahun 2023.
                    tags:
                    - wisatawan mancanegara
                    - kebangsaan
                    tier: primer
                    sumber: sdi
                    source: SDI · Satu Data Jakarta
                    size_label: 1.598 dilihat
                    href: /sdi/data-jumlah-wisatawan-mancanegara-berdasarkan-kebangsaan
                    external: false
                    medallion:
                      level: silver
                  - id: sdi-nilai-kepuasan-pengunjung-objek-wisata
                    title: Nilai Kepuasan Pengunjung Objek Wisata
                    description: Data ini berisikan nilai rata-rata hasil survey kepuasan pengunjung yang dilakukan
                      oleh Dinas Pariwisata dan Ekonomi Kreatif setiap tahun terhadap objek wisata. Lokasi objek
                      wisata yang disurvey sama setiap tahunnya. Pengukuran tingkat kepuasan pengunjung menggunakan
                      skala 1-100.
                    tags:
                    - nilai kepuasan
                    - pengunjung
                    tier: primer
                    sumber: sdi
                    source: SDI · Satu Data Jakarta
                    size_label: 936 dilihat
                    href: /sdi/nilai-kepuasan-pengunjung-objek-wisata
                    external: false
                    medallion:
                      level: silver
                  stats:
                    total: 184
                    tags: 264
                    views: 68553
                    last_updated: '2026-10-21T03:19:38.000000Z'
                  layer_counts:
                    bronze: 2
                    silver: 216
                    gold: 5
                meta:
                  generated_at: '2026-10-21T22:00:00+07:00'
                  source: *id001
                  request_id: contoh-01
                  total: 228
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '503':
          $ref: '#/components/responses/E503'
