  /v1/dashboard/ringkasan:
    get:
      operationId: dashboardRingkasan
      tags:
      - dashboard
      summary: KPI beranda dashboard
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      security:
      - bearer: []
      x-kelas: T
      x-sumber: &id007
      - serving.mart_wisman
      - lake.bronze_file.target_wisman
      - lake.bronze_file.pdrb_ekraf_makro
      - lake.bronze_file.target_kontribusi_ekraf_rpjmd
      x-catatan:
      - Bentuk dan contoh = golden plan 01 (`tests/golden/`), keluaran logika Next.js yang tayang.
      - '`kpi[]` = props KPI persis seperti dikirim halaman Next.js ke komponen tampilan (label dibangun dari data;
        `value` angka mentah atau teks siap tampil; `delta` angka mentah). Pengecualian aturan KONTRAK §3.4: dihitung
        di badan render Next.js, Nuxt merender apa adanya tanpa menghitung.'
      - Tahun 2025 (wisman) dan 2024 (PDRB) memang tetap di halaman Next.js.
      - 'Q21 (ditiru) untuk bagian wisman: bila query ClickHouse gagal, `wisman.jumlah` null dan `meta.peringatan` terisi,
        bukan 5xx. Bagian PDRB dari Bronze tetap 503 bila gagal (dulu konstanta).'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      wisman:
                        type: object
                        properties:
                          tahun:
                            type: string
                          jumlah:
                            type:
                            - integer
                            - 'null'
                          target:
                            type: integer
                        required:
                        - tahun
                        - jumlah
                        - target
                      pdrb:
                        type: object
                        properties:
                          tahun:
                            type: string
                          kontribusi_pct:
                            type: number
                          target_tahun:
                            type: string
                          target_pct:
                            type: number
                          adhb_ekraf_miliar:
                            type: number
                          tumbuh_ekraf_pct:
                            type: number
                          tumbuh_dki_pct:
                            type: number
                        required:
                        - tahun
                        - kontribusi_pct
                        - target_tahun
                        - target_pct
                        - adhb_ekraf_miliar
                        - tumbuh_ekraf_pct
                        - tumbuh_dki_pct
                      kpi:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                            value:
                              type:
                              - integer
                              - string
                            sub:
