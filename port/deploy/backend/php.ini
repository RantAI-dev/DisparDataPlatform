; Tambahan di atas php.ini-production (deploy/backend.Dockerfile).
expose_php = Off
memory_limit = 256M
; Ekspor dataset (kelas aliran) boleh berjalan 300 s; batas waktu dinding dijaga php-fpm
; (request_terminate_timeout) dan nginx.
max_execution_time = 300
; php.ini-production menyalakan output_buffering 4096; ekspor (StreamedResponse + flush()) harus
; langsung keluar per potongan, sama dengan image dev yang tanpa php.ini.
output_buffering = Off

; opcache produksi: kode di image tidak berubah selama container hidup, jadi timestamp tidak diperiksa.
; Config/route cache dibuat entrypoint sebelum php-fpm start, jadi tetap terbaca.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
