# nginx produksi backend (deploy/backend.Dockerfile). Berjalan sebagai www-data (bukan root), jadi
# port 8080 dan semua berkas sementara di /tmp. php-fpm ada di container yang sama (127.0.0.1:9000).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;
    # API hanya menerima GET dan POST kecil (rute admin).
    client_max_body_size 1m;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /var/www/backend/public;
        index index.php;

        # Dotfiles (.env, .git, .htaccess) tidak pernah dilayani.
        location ~ /\. {
            deny all;
        }

        # Ekspor dataset = kelas aliran (SPEC §4.6): Data API boleh 300 s (DATA_API_TIMEOUT_STREAM),
        # dan body diteruskan ke Nuxt tanpa ditahan di buffer nginx.
        location ~ ^/api/v1/dataset/[^/]+/ekspor$ {
            include /etc/nginx/fastcgi-laravel.conf;
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
            fastcgi_buffering off;
        }

        location / {
            try_files $uri /index.php?$query_string;
        }

        # Rute lain: Data API paling lama 60 s (DATA_API_TIMEOUT_LAMBAT) atau 3 × 10 s + jeda
        # (DATA_API_TIMEOUT × ulang), ditambah kerja Laravel/Oracle.
        location = /index.php {
            include /etc/nginx/fastcgi-laravel.conf;
            fastcgi_read_timeout 90s;
        }

        # Berkas .php lain di public/ tidak dieksekusi.
        location ~ \.php$ {
            return 404;
        }
    }
}
