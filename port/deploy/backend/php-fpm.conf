; php-fpm produksi backend. Menggantikan seluruh isi php-fpm.d bawaan image. Master berjalan sebagai
; www-data (USER di Dockerfile), jadi direktif user/group tidak dipakai.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[portal]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Di atas batas ekspor nginx/Data API (300 s) supaya aliran yang sah tidak diputus FPM lebih dulu.
request_terminate_timeout = 320s

; Log Laravel (LOG_CHANNEL=stderr) dari worker diteruskan ke log container apa adanya.
catch_workers_output = yes
decorate_workers_output = no
; Konfigurasi dibaca dari config cache, tetapi env tetap diteruskan bila cache dihapus.
clear_env = no
